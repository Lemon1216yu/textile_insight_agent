<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>织见 · 经营智能分析平台</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="app-body">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-logo">织</div>
    <div class="sidebar-brand-text">
      <div class="sidebar-title">织见</div>
      <div class="sidebar-sub">某某纺织有限公司</div>
    </div>
  </div>
  <nav class="side-nav" id="sideNav"></nav>
  <div class="sidebar-user" id="sidebarUser"></div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="page-title" id="pageTitle">经营总览</div>
    <div class="topbar-right">
      <button class="btn-ghost" id="btnPassword">修改密码</button>
      <button class="btn-ghost" id="btnLogout">退出登录</button>
    </div>
  </header>
  <section class="content" id="content"></section>
</main>

<!-- 修改密码弹窗 -->
<div class="modal-mask" id="passwordModal" hidden>
  <div class="modal">
    <div class="modal-head"><span>修改密码</span><button class="modal-close" data-close="passwordModal">×</button></div>
    <div class="modal-body">
      <label class="field-label">原密码</label>
      <input class="text-input" type="password" id="pwOld" autocomplete="off">
      <label class="field-label">新密码（至少 6 位）</label>
      <input class="text-input" type="password" id="pwNew" autocomplete="off">
      <label class="field-label">确认新密码</label>
      <input class="text-input" type="password" id="pwNew2" autocomplete="off">
      <div class="form-error" id="pwError" hidden></div>
    </div>
    <div class="modal-foot"><button class="btn-ghost" data-close="passwordModal">取消</button><button class="btn-primary" id="pwSave">保存</button></div>
  </div>
</div>

<!-- 账户编辑弹窗（仅管理员） -->
<div class="modal-mask" id="userModal" hidden>
  <div class="modal">
    <div class="modal-head"><span id="userModalTitle">新建用户</span><button class="modal-close" data-close="userModal">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="userEditId">
      <label class="field-label">用户名</label>
      <input class="text-input" id="uUsername" placeholder="字母、数字、下划线">
      <label class="field-label">姓名</label>
      <input class="text-input" id="uDisplay" placeholder="显示姓名">
      <label class="field-label">岗位</label>
      <select class="text-input" id="uRole"></select>
      <label class="field-label" id="uRegionLabel">数据区域（销售经理必填）</label>
      <select class="text-input" id="uRegion">
        <option value="">— 全公司 —</option>
        <option>华东</option><option>华南</option><option>华北</option>
      </select>
      <label class="field-label" id="uPwdLabel">初始密码（至少 6 位）</label>
      <input class="text-input" type="password" id="uPassword" placeholder="仅创建/重置密码时使用" autocomplete="off">
      <div class="form-error" id="uError" hidden></div>
    </div>
    <div class="modal-foot"><button class="btn-ghost" data-close="userModal">取消</button><button class="btn-primary" id="uSave">保存</button></div>
  </div>
</div>

<script src="/static/vendor/echarts.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
